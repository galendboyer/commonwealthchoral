<svg viewBox="0 0 760 680" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Numbered diagram: driscollsingers.net toggle test, both paths pre-configured</title>
<desc>Step 1: a sender's mail server has a message for driscollsingers.net. Step 2: it queries GoDaddy, the registrar, which holds the Nameservers setting — both possible answers are already preconfigured and ready. The left column, 3a/4a/5a, leads to Groupanizer via Cloudflare's nameservers and DNS zone. The right column, 3b/4b/5b, leads to a Google Workspace mailbox via GoDaddy's own nameservers and DNS records. The Nameservers setting is flipped back and forth repeatedly to confirm the toggle is reliable before doing the same toggle on commonwealthchorale.net.</desc>

<style>
  text { font-family: Arial, Helvetica, sans-serif; }
  .box { fill: #ffffff; stroke: #cccccc; stroke-width: 1.5; }
  .title { font-size: 14px; fill: #1a1a1a; font-weight: 700; text-anchor: middle; }
  .sub { font-size: 12px; fill: #555555; text-anchor: middle; }
  .muted { font-size: 11px; fill: #888888; text-anchor: middle; }
  .badge { font-size: 13px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
  .tag { font-size: 11px; font-weight: 700; text-anchor: middle; }
  .path-g { stroke: #4285F4; }
  .path-c { stroke: #F38020; }
</style>

<!-- Step 1: sender -->
<rect x="280" y="10" width="200" height="54" rx="10" class="box"/>
<circle cx="292" cy="22" r="13" fill="#666666"/>
<text x="292" y="27" class="badge">1</text>
<text x="390" y="33" class="title" font-size="14">Sender's mail server</text>
<text x="390" y="52" class="sub">has a message for driscollsingers.net</text>

<line x1="380" y1="64" x2="380" y2="88" stroke="#999999" stroke-width="2"/>
<polygon points="380,96 374,86 386,86" fill="#999999"/>

<!-- Step 2: GoDaddy registrar with toggle -->
<rect x="260" y="98" width="240" height="58" rx="10" class="box" stroke="#666666" stroke-width="2"/>
<circle cx="274" cy="110" r="13" fill="#666666"/>
<text x="274" y="115" class="badge">2</text>
<text x="380" y="126" class="title" font-size="14">GoDaddy (registrar)</text>
<text x="380" y="144" class="sub">Nameservers setting — the toggle switch</text>

<!-- toggle icon: curved double arrow above the box -->
<path d="M 330 84 A 50 20 0 0 1 430 84" stroke="#666666" stroke-width="2" fill="none"/>
<polygon points="330,84 340,78 340,90" fill="#666666"/>
<polygon points="430,84 420,78 420,90" fill="#666666"/>
<text x="380" y="78" font-size="11" fill="#666666" text-anchor="middle">flip back and forth, repeatedly</text>

<!-- fork -->
<line x1="380" y1="156" x2="380" y2="176" stroke="#999999" stroke-width="2"/>
<line x1="190" y1="176" x2="570" y2="176" stroke="#999999" stroke-width="2"/>
<line x1="190" y1="176" x2="190" y2="196" class="path-c" stroke-width="2"/>
<line x1="570" y1="176" x2="570" y2="196" class="path-g" stroke-width="2"/>
<polygon points="190,204 184,194 196,194" fill="#F38020"/>
<polygon points="570,204 564,194 576,194" fill="#4285F4"/>

<!-- status tags: both preconfigured -->
<rect x="140" y="182" width="100" height="18" rx="9" fill="#fff2e8" stroke="#F38020"/>
<text x="190" y="195" class="tag" fill="#F38020">PRECONFIGURED</text>
<rect x="520" y="182" width="100" height="18" rx="9" fill="#eef3fc" stroke="#4285F4"/>
<text x="570" y="195" class="tag" fill="#4285F4">PRECONFIGURED</text>

<!-- Step 3a (left, Groupanizer) -->
<rect x="80" y="206" width="220" height="56" rx="10" class="box" stroke="#F38020"/>
<circle cx="94" cy="218" r="13" fill="#F38020"/>
<text x="94" y="223" class="badge">3a</text>
<text x="190" y="231" class="title">Nameservers → Groupanizer</text>
<text x="190" y="249" class="sub">one possible setting</text>

<!-- Step 3b (right, Google) -->
<rect x="460" y="206" width="220" height="56" rx="10" class="box" stroke="#4285F4"/>
<circle cx="474" cy="218" r="13" fill="#4285F4"/>
<text x="474" y="223" class="badge">3b</text>
<text x="570" y="231" class="title">Nameservers → Google</text>
<text x="570" y="249" class="sub">the other possible setting</text>

<line x1="190" y1="262" x2="190" y2="286" class="path-c" stroke-width="2"/>
<polygon points="190,294 184,284 196,284" fill="#F38020"/>
<line x1="570" y1="262" x2="570" y2="286" class="path-g" stroke-width="2"/>
<polygon points="570,294 564,284 576,284" fill="#4285F4"/>

<!-- Step 4a (left, Groupanizer) -->
<rect x="70" y="296" width="240" height="66" rx="10" class="box" stroke="#F38020"/>
<circle cx="84" cy="308" r="13" fill="#F38020"/>
<text x="84" y="313" class="badge">4a</text>
<text x="190" y="322" class="title">DNS records → Groupanizer</text>
<text x="190" y="340" class="sub">via Cloudflare's DNS zone</text>
<text x="190" y="355" class="muted">(already sitting there, ready)</text>

<!-- Step 4b (right, Google) -->
<rect x="450" y="296" width="240" height="66" rx="10" class="box" stroke="#4285F4"/>
<circle cx="464" cy="308" r="13" fill="#4285F4"/>
<text x="464" y="313" class="badge">4b</text>
<text x="570" y="322" class="title">DNS records → Google</text>
<text x="570" y="340" class="sub">via GoDaddy's DNS Records tab</text>
<text x="570" y="355" class="muted">(already sitting there, ready)</text>

<line x1="190" y1="362" x2="190" y2="386" class="path-c" stroke-width="2"/>
<polygon points="190,394 184,384 196,384" fill="#F38020"/>
<line x1="570" y1="362" x2="570" y2="386" class="path-g" stroke-width="2"/>
<polygon points="570,394 564,384 576,384" fill="#4285F4"/>

<!-- Step 5a (left, Groupanizer) -->
<rect x="70" y="396" width="240" height="70" rx="10" class="box" stroke="#F38020" stroke-width="2"/>
<circle cx="84" cy="408" r="13" fill="#F38020"/>
<text x="84" y="413" class="badge">5a</text>
<text x="190" y="424" class="title">Groupanizer</text>
<text x="190" y="442" class="sub">Cloudflare Email Routing rule fires,</text>
<text x="190" y="457" class="sub">message forwarded here</text>

<!-- Step 5b (right, Google) -->
<rect x="450" y="396" width="240" height="70" rx="10" class="box" stroke="#4285F4" stroke-width="2"/>
<circle cx="464" cy="408" r="13" fill="#4285F4"/>
<text x="464" y="413" class="badge">5b</text>
<text x="570" y="424" class="title">Google Workspace mailbox</text>
<text x="570" y="442" class="sub">SPF / DKIM / DMARC checked,</text>
<text x="570" y="457" class="sub">then delivered</text>

<!-- legend -->
<line x1="140" y1="500" x2="170" y2="500" stroke="#F38020" stroke-width="3"/>
<text x="180" y="504" font-size="12" fill="#555555" text-anchor="start">Cloudflare / Groupanizer path — preconfigured</text>
<line x1="480" y1="500" x2="510" y2="500" stroke="#4285F4" stroke-width="3"/>
<text x="520" y="504" font-size="12" fill="#555555" text-anchor="start">Google path — preconfigured</text>

<text x="380" y="536" font-size="12" fill="#888888" text-anchor="middle">Both columns are already built. Only step 2's Nameservers value decides which one actually answers.</text>
<text x="380" y="556" font-size="12" fill="#888888" text-anchor="middle">The toggle is flipped more than once, in both directions, to confirm it switches reliably.</text>
<text x="380" y="576" font-size="12" fill="#888888" text-anchor="middle">Once proven, the same toggle action is repeated on commonwealthchorale.net with its own real settings.</text>

</svg>
