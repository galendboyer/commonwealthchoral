<svg viewBox="0 0 760 660" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Numbered diagram: commonwealthchorale.net's current Cloudflare path to Groupanizer and its Google target</title>
<desc>Step 1: a sender's mail server has a message for commonwealthchorale.net. Step 2: it queries GoDaddy, the registrar. A highlighted orange arrow curves from GoDaddy to the right column, marked ACTIVE now — Cloudflare's nameservers and DNS zone, ending at Groupanizer. The left column is the Google target: GoDaddy's own nameservers and DNS records leading to a Google Workspace mailbox, drawn dashed because it hasn't been built yet.</desc>

<style>
  text { font-family: Arial, Helvetica, sans-serif; }
  .box { fill: #ffffff; stroke: #cccccc; stroke-width: 1.5; }
  .title { font-size: 14px; fill: #1a1a1a; font-weight: 700; text-anchor: middle; }
  .sub { font-size: 12px; fill: #555555; text-anchor: middle; }
  .muted { font-size: 11px; fill: #888888; text-anchor: middle; }
  .badge { font-size: 13px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
  .tag { font-size: 11px; font-weight: 700; text-anchor: middle; }
  .path-g { stroke: #4285F4; }
  .path-c { stroke: #F38020; }
</style>

<!-- Step 1: sender -->
<rect x="280" y="10" width="200" height="54" rx="10" class="box"/>
<circle cx="292" cy="22" r="13" fill="#666666"/>
<text x="292" y="27" class="badge">1</text>
<text x="390" y="33" class="title" font-size="14">Sender's mail server</text>
<text x="390" y="52" class="sub">has a message for commonwealthchorale.net</text>

<line x1="380" y1="64" x2="380" y2="88" stroke="#999999" stroke-width="2"/>
<polygon points="380,96 374,86 386,86" fill="#999999"/>

<!-- Step 2: GoDaddy registrar -->
<rect x="260" y="98" width="240" height="58" rx="10" class="box" stroke="#666666" stroke-width="2"/>
<circle cx="274" cy="110" r="13" fill="#666666"/>
<text x="274" y="115" class="badge">2</text>
<text x="380" y="126" class="title" font-size="14">GoDaddy (registrar)</text>
<text x="380" y="144" class="sub">checks the Nameservers setting</text>

<!-- neutral fork structure -->
<line x1="380" y1="156" x2="380" y2="176" stroke="#999999" stroke-width="2"/>
<line x1="190" y1="176" x2="570" y2="176" stroke="#999999" stroke-width="2"/>
<line x1="190" y1="176" x2="190" y2="196" class="path-g" stroke-width="2"/>
<polygon points="190,204 184,194 196,194" fill="#4285F4"/>

<!-- explicit ACTIVE arrow: GoDaddy box curves right to Cloudflare box -->
<path d="M 470 130 C 560 150, 610 170, 610 200" stroke="#F38020" stroke-width="4" fill="none"/>
<polygon points="610,206 602,194 618,194" fill="#F38020"/>
<text x="640" y="168" font-size="12" fill="#F38020" font-weight="700" text-anchor="middle">ACTIVE</text>
<text x="640" y="182" font-size="11" fill="#F38020" text-anchor="middle">now</text>

<!-- status tags -->
<rect x="140" y="182" width="100" height="18" rx="9" fill="#eef3fc" stroke="#4285F4"/>
<text x="190" y="195" class="tag" fill="#4285F4">PRECONFIGURED</text>
<rect x="520" y="182" width="100" height="18" rx="9" fill="#fff2e8" stroke="#F38020"/>
<text x="570" y="195" class="tag" fill="#F38020">PRECONFIGURED</text>

<!-- Step 3a (left, Google — target) -->
<rect x="80" y="206" width="220" height="56" rx="10" class="box" stroke="#4285F4"/>
<circle cx="94" cy="218" r="13" fill="#4285F4"/>
<text x="94" y="223" class="badge">3a</text>
<text x="190" y="231" class="title">Nameservers → Google</text>
<text x="190" y="249" class="sub">ready, but not the active path</text>

<!-- Step 3b (right, Cloudflare — active) -->
<rect x="460" y="206" width="220" height="56" rx="10" class="box" stroke="#F38020" stroke-width="2.5"/>
<circle cx="474" cy="218" r="13" fill="#F38020"/>
<text x="474" y="223" class="badge">3b</text>
<text x="570" y="231" class="title">Nameservers → Cloudflare</text>
<text x="570" y="249" class="sub">nile / tia.ns.cloudflare.com</text>

<line x1="190" y1="262" x2="190" y2="286" class="path-g" stroke-width="2"/>
<polygon points="190,294 184,284 196,284" fill="#4285F4"/>
<line x1="570" y1="262" x2="570" y2="286" class="path-c" stroke-width="2"/>
<polygon points="570,294 564,284 576,284" fill="#F38020"/>

<!-- Step 4a (left, Google — target) -->
<rect x="70" y="296" width="240" height="66" rx="10" class="box" stroke="#4285F4"/>
<circle cx="84" cy="308" r="13" fill="#4285F4"/>
<text x="84" y="313" class="badge">4a</text>
<text x="190" y="322" class="title">DNS records → Google</text>
<text x="190" y="340" class="sub">MX would answer with Google's servers</text>
<text x="190" y="355" class="muted">(preconfigured, not the active path)</text>

<!-- Step 4b (right, Cloudflare — active) -->
<rect x="450" y="296" width="240" height="66" rx="10" class="box" stroke="#F38020" stroke-width="2.5"/>
<circle cx="464" cy="308" r="13" fill="#F38020"/>
<text x="464" y="313" class="badge">4b</text>
<text x="570" y="322" class="title">DNS records → Cloudflare</text>
<text x="570" y="340" class="sub">MX answer: Cloudflare mail routing</text>
<text x="570" y="355" class="muted">(this is what's live right now)</text>

<line x1="190" y1="362" x2="190" y2="386" class="path-g" stroke-width="2"/>
<polygon points="190,394 184,384 196,384" fill="#4285F4"/>
<line x1="570" y1="362" x2="570" y2="386" class="path-c" stroke-width="2"/>
<polygon points="570,394 564,384 576,384" fill="#F38020"/>

<!-- Step 5a (left, Google — target, dashed) -->
<rect x="70" y="396" width="240" height="70" rx="10" class="box" stroke="#4285F4" stroke-width="2" stroke-dasharray="5,4"/>
<circle cx="84" cy="408" r="13" fill="#4285F4"/>
<text x="84" y="413" class="badge">5a</text>
<text x="190" y="424" class="title">Google Workspace mailbox</text>
<text x="190" y="442" class="sub">the goal after migration —</text>
<text x="190" y="457" class="sub">ready, but not active</text>

<!-- Step 5b (right, Cloudflare — active, now named) -->
<rect x="450" y="396" width="240" height="70" rx="10" class="box" stroke="#F38020" stroke-width="2.5"/>
<circle cx="464" cy="408" r="13" fill="#F38020"/>
<text x="464" y="413" class="badge">5b</text>
<text x="570" y="424" class="title">Groupanizer</text>
<text x="570" y="442" class="sub">Cloudflare Email Routing rule fires,</text>
<text x="570" y="457" class="sub">message forwarded here</text>

<!-- legend -->
<line x1="100" y1="500" x2="130" y2="500" stroke="#4285F4" stroke-width="3"/>
<text x="140" y="504" font-size="12" fill="#555555" text-anchor="start">Google path — preconfigured, target</text>
<line x1="440" y1="500" x2="470" y2="500" stroke="#F38020" stroke-width="3"/>
<text x="480" y="504" font-size="12" fill="#555555" text-anchor="start">Cloudflare path — preconfigured, active</text>

<text x="380" y="536" font-size="12" fill="#888888" text-anchor="middle">Both columns exist and are ready — the orange arrow shows which one actually answers today.</text>
<text x="380" y="556" font-size="12" fill="#888888" text-anchor="middle">Nothing here should change until the driscollsingers.net toggle test below is proven reliable.</text>

</svg>
